<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b88860"/>
      <stop offset="100%" stop-color="#a87850"/>
    </linearGradient>
    <linearGradient id="khadi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e8dfcf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — PRODUCTION CHARACTER REFERENCE SHEET</text>
  <text x="750" y="82" fill="#a89078" font-size="20">CHARACTER: KOVUR KIZHAR (கோவூர் கிழார்) • SANGAM POET • SCALE: 1.76m (1.0x)</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">SHEET ID: CH-02-KVR</text>

  <!-- Panel 1: Turnaround Views (A, B, C, D) -->
  <rect x="40" y="130" width="820" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="60" y="160" fill="#f59e0b" font-size="16" font-weight="600">ORTHOGRAPHIC TURNAROUND (VIEWS A, B, C, D)</text>

  <!-- View A: Front -->
  <g transform="translate(110, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="42" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <rect x="64" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <!-- Full Khadi Dhoti & Drape -->
    <path d="M 36 170 L 84 170 L 88 300 L 32 300 Z" fill="url(#khadi)"/>
    <!-- Shawl crossed over chest -->
    <path d="M 34 110 L 86 110 L 80 230 L 40 230 Z" fill="url(#khadi)"/>
    <path d="M 34 110 L 75 220" stroke="#c4b8a5" stroke-width="2"/>
    <!-- Tamarind staff in right hand -->
    <line x1="26" y1="90" x2="26" y2="315" stroke="#4a3728" stroke-width="5" stroke-linecap="round"/>
    <rect x="22" y="150" width="10" height="15" rx="3" fill="#a87850"/>
    <!-- Head & Beard -->
    <rect x="53" y="90" width="14" height="20" fill="#a87850"/>
    <ellipse cx="60" cy="70" rx="19" ry="24" fill="url(#skin)"/>
    <!-- Silver beard -->
    <path d="M 45 74 Q 60 108 75 74 Z" fill="#d4cfc7"/>
    <path d="M 42 62 Q 60 40 78 62 Z" fill="#b0a89e"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">A. FRONT</text>
  </g>

  <!-- View B: Left Side Profile -->
  <g transform="translate(310, 190)">
    <ellipse cx="60" cy="320" rx="45" ry="8" fill="#0d0a08"/>
    <rect x="50" y="305" width="20" height="12" rx="4" fill="#a87850"/>
    <path d="M 40 170 L 76 170 L 74 300 L 38 300 Z" fill="url(#khadi)"/>
    <rect x="42" y="110" width="32" height="65" rx="6" fill="url(#khadi)"/>
    <line x1="78" y1="90" x2="78" y2="315" stroke="#4a3728" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="58" cy="70" rx="18" ry="24" fill="url(#skin)"/>
    <!-- Beard profile -->
    <path d="M 58 74 Q 72 90 60 104 Z" fill="#d4cfc7"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">B. LEFT PROFILE</text>
  </g>

  <!-- View C: Back View -->
  <g transform="translate(510, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="42" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <rect x="64" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <path d="M 36 170 L 84 170 L 88 300 L 32 300 Z" fill="url(#khadi)"/>
    <path d="M 34 110 L 86 110 L 80 230 L 40 230 Z" fill="url(#khadi)"/>
    <ellipse cx="60" cy="70" rx="20" ry="24" fill="#b0a89e"/>
    <circle cx="60" cy="54" r="8" fill="#d4cfc7"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">C. BACK VIEW</text>
  </g>

  <!-- View D: Three-Quarter -->
  <g transform="translate(710, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="44" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <rect x="68" y="305" width="14" height="12" rx="4" fill="#a87850"/>
    <path d="M 36 170 L 84 170 L 86 300 L 34 300 Z" fill="url(#khadi)"/>
    <path d="M 34 110 L 86 110 L 82 230 L 38 230 Z" fill="url(#khadi)"/>
    <line x1="32" y1="90" x2="32" y2="315" stroke="#4a3728" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="62" cy="70" rx="19" ry="24" fill="url(#skin)"/>
    <path d="M 48 74 Q 64 106 74 74 Z" fill="#d4cfc7"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">D. 3/4 HERO ANGLE</text>
  </g>

  <!-- Panel 2: View E - Face Close-up -->
  <rect x="880" y="130" width="320" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="900" y="160" fill="#f59e0b" font-size="16" font-weight="600">VIEW E: FACE CLOSE-UP &amp; BEARD</text>
  <g transform="translate(930, 190)">
    <ellipse cx="110" cy="140" rx="85" ry="105" fill="url(#skin)"/>
    <!-- Grey hair knot -->
    <path d="M 30 110 C 35 25, 185 25, 190 110 Z" fill="#b0a89e"/>
    <circle cx="110" cy="30" r="22" fill="#d4cfc7"/>
    <!-- Deep eye wrinkles -->
    <path d="M 55 105 Q 75 98 95 106" stroke="#241a13" stroke-width="4" fill="none"/>
    <path d="M 125 106 Q 145 98 165 105" stroke="#241a13" stroke-width="4" fill="none"/>
    <path d="M 45 125 L 55 125 M 165 125 L 175 125" stroke="#78553d" stroke-width="2.5"/>
    <!-- Calm wise eyes -->
    <ellipse cx="75" cy="125" rx="14" ry="8" fill="#ffffff"/>
    <circle cx="75" cy="125" r="5.5" fill="#1a1008"/>
    <ellipse cx="145" cy="125" rx="14" ry="8" fill="#ffffff"/>
    <circle cx="145" cy="125" r="5.5" fill="#1a1008"/>
    <!-- Silver mustache & long beard -->
    <path d="M 80 170 Q 110 185 140 170 Q 125 160 110 162 Q 95 160 80 170 Z" fill="#e0dad2"/>
    <path d="M 60 180 Q 110 270 160 180 Q 140 230 110 250 Q 80 230 60 180 Z" fill="#d4cfc7"/>
    <text x="110" y="310" fill="#a89078" font-size="12" text-anchor="middle">SANGAM POET ELDER DIGNITY &amp; SILVER BEARD</text>
  </g>

  <!-- Panel 3: View G - Material & Color Swatches -->
  <rect x="1220" y="130" width="340" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="1240" y="160" fill="#f59e0b" font-size="16" font-weight="600">VIEW G: MATERIAL SWATCHES</text>
  <g transform="translate(1240, 185)">
    <circle cx="25" cy="25" r="20" fill="#a87850" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="22" fill="#e5e7eb" font-size="14" font-weight="bold">Skin: Olive Brown (#a87850)</text>
    <text x="60" y="38" fill="#9ca3af" font-size="11">Roughness: 0.62 • Weathered Micro-wrinkles</text>

    <circle cx="25" cy="85" r="20" fill="#e8dfcf" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="82" fill="#e5e7eb" font-size="14" font-weight="bold">Garment: Khadi White (#e8dfcf)</text>
    <text x="60" y="98" fill="#9ca3af" font-size="11">Roughness: 0.90 • Unbleached Cotton</text>

    <circle cx="25" cy="145" r="20" fill="#d4cfc7" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="142" fill="#e5e7eb" font-size="14" font-weight="bold">Beard: Silver Grey (#d4cfc7)</text>
    <text x="60" y="158" fill="#9ca3af" font-size="11">Roughness: 0.80 • Stranded Ascetic Trimming</text>

    <circle cx="25" cy="205" r="20" fill="#4a3728" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="202" fill="#e5e7eb" font-size="14" font-weight="bold">Prop: Tamarind Staff (#4a3728)</text>
    <text x="60" y="218" fill="#9ca3af" font-size="11">Roughness: 0.55 • Polished Ancient Wood</text>

    <circle cx="25" cy="265" r="20" fill="#bda98c" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="262" fill="#e5e7eb" font-size="14" font-weight="bold">Border: Sand Hem (#bda98c)</text>
    <text x="60" y="278" fill="#9ca3af" font-size="11">Roughness: 0.85 • Handloom Border Stitch</text>
  </g>

  <!-- Panel 4: View F - 8 Expression Matrix -->
  <rect x="40" y="570" width="820" height="390" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="60" y="600" fill="#f59e0b" font-size="16" font-weight="600">VIEW F: EIGHT-EXPRESSION MATRIX (QUIET RESTRAINT)</text>
  <g transform="translate(60, 620)">
    <!-- 8 Expressions in 4x2 grid -->
    <g transform="translate(0, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 35 60 Q 45 78 55 60 Z" fill="#d4cfc7"/>
      <ellipse cx="32" cy="40" rx="4" ry="3" fill="#1a1008"/>
      <ellipse cx="58" cy="40" rx="4" ry="3" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">1. Neutral</text>
    </g>
    <g transform="translate(190, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 26 28 Q 33 22 41 27" stroke="#241a13" stroke-width="2.5" fill="none"/>
      <path d="M 35 60 Q 45 78 55 60 Z" fill="#d4cfc7"/>
      <ellipse cx="32" cy="40" rx="5" ry="4" fill="#1a1008"/>
      <ellipse cx="58" cy="40" rx="5" ry="4" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">2. Curiosity</text>
    </g>
    <g transform="translate(380, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 35 58 Q 45 75 55 58 Z" fill="#d4cfc7"/>
      <path d="M 28 40 Q 32 36 36 40" stroke="#1a1008" stroke-width="2.5" fill="none"/>
      <path d="M 54 40 Q 58 36 62 40" stroke="#1a1008" stroke-width="2.5" fill="none"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">3. Small Happiness</text>
    </g>
    <g transform="translate(570, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 26 31 Q 33 25 41 29" stroke="#241a13" stroke-width="3" fill="none"/>
      <path d="M 49 29 Q 57 25 64 31" stroke="#241a13" stroke-width="3" fill="none"/>
      <path d="M 35 60 Q 45 78 55 60 Z" fill="#d4cfc7"/>
      <ellipse cx="32" cy="41" rx="4" ry="3" fill="#1a1008"/>
      <ellipse cx="58" cy="41" rx="4" ry="3" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">4. Concern</text>
    </g>
    <g transform="translate(0, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <circle cx="32" cy="38" r="6" fill="#ffffff"/>
      <circle cx="32" cy="38" r="3" fill="#1a1008"/>
      <circle cx="58" cy="38" r="6" fill="#ffffff"/>
      <circle cx="58" cy="38" r="3" fill="#1a1008"/>
      <path d="M 35 60 Q 45 78 55 60 Z" fill="#d4cfc7"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">5. Fear (Internal Tension)</text>
    </g>
    <g transform="translate(190, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 26 27 L 40 31" stroke="#241a13" stroke-width="3.5"/>
      <path d="M 50 31 L 64 27" stroke="#241a13" stroke-width="3.5"/>
      <ellipse cx="32" cy="40" rx="4" ry="2.5" fill="#1a1008"/>
      <ellipse cx="58" cy="40" rx="4" ry="2.5" fill="#1a1008"/>
      <path d="M 35 59 Q 45 78 55 59 Z" fill="#d4cfc7"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">6. Moral Resolve</text>
    </g>
    <g transform="translate(380, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 26 33 Q 33 26 40 30" stroke="#241a13" stroke-width="2.5" fill="none"/>
      <path d="M 50 30 Q 57 26 64 33" stroke="#241a13" stroke-width="2.5" fill="none"/>
      <path d="M 35 62 Q 45 80 55 62 Z" fill="#d4cfc7"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">7. Sadness</text>
    </g>
    <g transform="translate(570, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 28 41 Q 32 44 36 41" stroke="#1a1008" stroke-width="2" fill="none"/>
      <path d="M 54 41 Q 58 44 62 41" stroke="#1a1008" stroke-width="2" fill="none"/>
      <path d="M 35 58 Q 45 74 55 58 Z" fill="#d4cfc7"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">8. Relief</text>
    </g>
  </g>

  <!-- Panel 5: View H, I, J - Rig, Props, Poses -->
  <rect x="880" y="570" width="680" height="390" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="900" y="600" fill="#f59e0b" font-size="16" font-weight="600">VIEWS H, I, J: RIG SKELETON &amp; SIGNATURE POSES</text>

  <g transform="translate(910, 630)">
    <text x="0" y="20" fill="#e5e7eb" font-size="14" font-weight="bold">I. RIG HIERARCHY (36 BONES)</text>
    <path d="M 80 40 L 80 85 L 80 145 M 80 65 L 50 85 L 35 130 M 80 65 L 110 85 L 125 130 M 80 145 L 60 200 L 60 270 M 80 145 L 100 200 L 100 270" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="40" r="5" fill="#34d399"/>
    <circle cx="80" cy="65" r="4" fill="#34d399"/>
    <circle cx="50" cy="85" r="4" fill="#34d399"/>
    <circle cx="35" cy="130" r="4" fill="#34d399"/>
    <circle cx="110" cy="85" r="4" fill="#34d399"/>
    <circle cx="125" cy="130" r="4" fill="#34d399"/>
    <circle cx="80" cy="145" r="5" fill="#34d399"/>
    <circle cx="60" cy="200" r="4" fill="#34d399"/>
    <circle cx="60" cy="270" r="4" fill="#ef4444"/>
    <circle cx="100" cy="200" r="4" fill="#34d399"/>
    <circle cx="100" cy="270" r="4" fill="#ef4444"/>
    <text x="80" y="295" fill="#9ca3af" font-size="11" text-anchor="middle">36 Bones • Beard Chain &amp; Drape Helpers</text>
  </g>

  <g transform="translate(1110, 630)">
    <text x="0" y="20" fill="#e5e7eb" font-size="14" font-weight="bold">J. SIX SIGNATURE ACTING POSES</text>
    <text x="0" y="55" fill="#f3f4f6" font-size="13">1. <tspan fill="#f59e0b">Listening Pause:</tspan> Eyes move first, head turns with measured delay</text>
    <text x="0" y="85" fill="#f3f4f6" font-size="13">2. <tspan fill="#f59e0b">Poet's Appeal:</tspan> Stepping forward with single open palm toward kings</text>
    <text x="0" y="115" fill="#f3f4f6" font-size="13">3. <tspan fill="#f59e0b">Moral Challenge:</tspan> Lifts chin high before addressing royal sovereigns</text>
    <text x="0" y="145" fill="#f3f4f6" font-size="13">4. <tspan fill="#f59e0b">Protective Stance:</tspan> Placing hand on Ilangathir's shoulder</text>
    <text x="0" y="175" fill="#f3f4f6" font-size="13">5. <tspan fill="#f59e0b">Quiet Stillness:</tspan> Remaining motionless between opposing armies</text>
    <text x="0" y="205" fill="#f3f4f6" font-size="13">6. <tspan fill="#f59e0b">Salute of Peace:</tspan> Traditional Sangam vanakkam hand clasp</text>

    <rect x="0" y="235" width="410" height="60" fill="#14110e" rx="6" stroke="#443427"/>
    <text x="15" y="258" fill="#d97706" font-size="12" font-weight="bold">H. HISTORICAL LITERARY CITATION</text>
    <text x="15" y="278" fill="#9ca3af" font-size="11">புறநானூறு பாடல் 45: "ஒருவீர் தோற்பினும், தோற்ப நும் குடியே."</text>
  </g>
</svg>
