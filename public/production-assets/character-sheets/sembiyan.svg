<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aa7048"/>
      <stop offset="100%" stop-color="#98603c"/>
    </linearGradient>
    <linearGradient id="ochre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#945f35"/>
      <stop offset="100%" stop-color="#80502a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — PRODUCTION CHARACTER REFERENCE SHEET</text>
  <text x="750" y="82" fill="#a89078" font-size="20">CHARACTER: SEMBIYAN (செம்பியன்) • POTTER / CONSCRIPTED WARRIOR • SCALE: 1.74m (1.0x)</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">SHEET ID: CH-04-SMB</text>

  <!-- Panel 1: Turnarounds A, B, C, D -->
  <rect x="40" y="130" width="820" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="60" y="160" fill="#f59e0b" font-size="16" font-weight="600">ORTHOGRAPHIC TURNAROUND (VIEWS A, B, C, D)</text>

  <!-- Front A -->
  <g transform="translate(110, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="42" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <rect x="64" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <path d="M 36 170 L 84 170 L 88 300 L 32 300 Z" fill="url(#ochre)"/>
    <rect x="40" y="105" width="40" height="70" rx="6" fill="#98603c"/>
    <line x1="40" y1="110" x2="80" y2="175" stroke="#3e2716" stroke-width="6"/>
    <!-- Iron Spear in right hand -->
    <line x1="22" y1="70" x2="22" y2="315" stroke="#3a3a3a" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="19,70 25,70 22,50" fill="#4a4a4a"/>
    <ellipse cx="60" cy="72" rx="20" ry="24" fill="url(#skin)"/>
    <!-- Short craftsman beard -->
    <path d="M 46 76 Q 60 96 74 76 Z" fill="#181412"/>
    <path d="M 40 64 Q 60 42 80 64 Z" fill="#181412"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">A. FRONT</text>
  </g>

  <!-- Profile B -->
  <g transform="translate(310, 190)">
    <ellipse cx="60" cy="320" rx="45" ry="8" fill="#0d0a08"/>
    <rect x="50" y="305" width="20" height="12" rx="4" fill="#98603c"/>
    <path d="M 40 170 L 76 170 L 74 300 L 38 300 Z" fill="url(#ochre)"/>
    <rect x="42" y="105" width="34" height="70" rx="6" fill="#98603c"/>
    <line x1="78" y1="70" x2="78" y2="315" stroke="#3a3a3a" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="75,70 81,70 78,50" fill="#4a4a4a"/>
    <ellipse cx="58" cy="72" rx="19" ry="24" fill="url(#skin)"/>
    <path d="M 58 76 Q 72 90 60 98 Z" fill="#181412"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">B. LEFT PROFILE</text>
  </g>

  <!-- Back C -->
  <g transform="translate(510, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="42" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <rect x="64" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <path d="M 36 170 L 84 170 L 88 300 L 32 300 Z" fill="url(#ochre)"/>
    <rect x="40" y="105" width="40" height="70" rx="6" fill="#98603c"/>
    <ellipse cx="60" cy="70" rx="20" ry="24" fill="#181412"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">C. BACK VIEW</text>
  </g>

  <!-- 3/4 D -->
  <g transform="translate(710, 190)">
    <ellipse cx="60" cy="320" rx="55" ry="8" fill="#0d0a08"/>
    <rect x="44" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <rect x="68" y="305" width="14" height="12" rx="4" fill="#98603c"/>
    <path d="M 36 170 L 84 170 L 86 300 L 34 300 Z" fill="url(#ochre)"/>
    <rect x="40" y="105" width="40" height="70" rx="6" fill="#98603c"/>
    <ellipse cx="62" cy="72" rx="20" ry="24" fill="url(#skin)"/>
    <path d="M 48 76 Q 64 96 74 76 Z" fill="#181412"/>
    <text x="60" y="350" fill="#9ca3af" font-size="13" text-anchor="middle">D. 3/4 HERO ANGLE</text>
  </g>

  <!-- View E: Face Close-up -->
  <rect x="880" y="130" width="320" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="900" y="160" fill="#f59e0b" font-size="16" font-weight="600">VIEW E: FACE &amp; CRAFTSMAN BEARD</text>
  <g transform="translate(930, 190)">
    <ellipse cx="110" cy="140" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M 25 110 C 30 20, 190 20, 195 110 Z" fill="#181412"/>
    <path d="M 50 110 Q 75 102 95 112" stroke="#1c140d" stroke-width="5" fill="none"/>
    <path d="M 125 112 Q 145 102 170 110" stroke="#1c140d" stroke-width="5" fill="none"/>
    <ellipse cx="75" cy="130" rx="15" ry="9" fill="#ffffff"/>
    <circle cx="75" cy="130" r="6" fill="#1a1008"/>
    <ellipse cx="145" cy="130" rx="15" ry="9" fill="#ffffff"/>
    <circle cx="145" cy="130" r="6" fill="#1a1008"/>
    <!-- Short trim beard -->
    <path d="M 70 180 Q 110 240 150 180 Q 130 200 110 205 Q 90 200 70 180 Z" fill="#181412"/>
    <text x="110" y="310" fill="#a89078" font-size="12" text-anchor="middle">FATHER / POTTER'S FATIGUE &amp; WARMTH</text>
  </g>

  <!-- View G: Materials -->
  <rect x="1220" y="130" width="340" height="420" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="1240" y="160" fill="#f59e0b" font-size="16" font-weight="600">VIEW G: MATERIAL SWATCHES</text>
  <g transform="translate(1240, 185)">
    <circle cx="25" cy="25" r="20" fill="#98603c" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="22" fill="#e5e7eb" font-size="14" font-weight="bold">Skin: Copper Brown (#98603c)</text>
    <text x="60" y="38" fill="#9ca3af" font-size="11">Roughness: 0.58 • Sun-baked Artisan Tone</text>

    <circle cx="25" cy="85" r="20" fill="#80502a" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="82" fill="#e5e7eb" font-size="14" font-weight="bold">Garment: Worn Ochre (#80502a)</text>
    <text x="60" y="98" fill="#9ca3af" font-size="11">Roughness: 0.85 • Coarse Field Fabric</text>

    <circle cx="25" cy="145" r="20" fill="#3a3a3a" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="142" fill="#e5e7eb" font-size="14" font-weight="bold">Prop: Iron Spear Tip (#3a3a3a)</text>
    <text x="60" y="158" fill="#9ca3af" font-size="11">Metalness: 0.75 • Roughness: 0.40</text>

    <circle cx="25" cy="205" r="20" fill="#3e2716" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="60" y="202" fill="#e5e7eb" font-size="14" font-weight="bold">Harness: Leather Strap (#3e2716)</text>
    <text x="60" y="218" fill="#9ca3af" font-size="11">Roughness: 0.70 • Conscript Gear</text>
  </g>

  <!-- View F: 8 Expressions -->
  <rect x="40" y="570" width="820" height="390" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="60" y="600" fill="#f59e0b" font-size="16" font-weight="600">VIEW F: EIGHT-EXPRESSION MATRIX (THE MAKER FORCED TO FIGHT)</text>
  <g transform="translate(60, 620)">
    <g transform="translate(0, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 35 60 Q 45 74 55 60 Z" fill="#181412"/>
      <ellipse cx="32" cy="40" rx="4.5" ry="3.5" fill="#1a1008"/>
      <ellipse cx="58" cy="40" rx="4.5" ry="3.5" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">1. Neutral</text>
    </g>
    <g transform="translate(190, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 50 24 Q 60 18 70 24" stroke="#1c140d" stroke-width="3" fill="none"/>
      <path d="M 35 60 Q 45 74 55 60 Z" fill="#181412"/>
      <ellipse cx="32" cy="40" rx="5" ry="4" fill="#1a1008"/>
      <ellipse cx="58" cy="40" rx="5" ry="4" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">2. Camp Inquiry</text>
    </g>
    <g transform="translate(380, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 35 58 Q 45 72 55 58 Z" fill="#181412"/>
      <path d="M 28 40 Q 32 35 36 40" stroke="#1a1008" stroke-width="3" fill="none"/>
      <path d="M 54 40 Q 58 35 62 40" stroke="#1a1008" stroke-width="3" fill="none"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">3. Pride at Wheel</text>
    </g>
    <g transform="translate(570, 0)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 25 32 Q 33 26 41 30" stroke="#1c140d" stroke-width="3" fill="none"/>
      <path d="M 49 30 Q 57 26 65 32" stroke="#1c140d" stroke-width="3" fill="none"/>
      <path d="M 35 60 Q 45 74 55 60 Z" fill="#181412"/>
      <ellipse cx="32" cy="42" rx="4.5" ry="3.5" fill="#1a1008"/>
      <ellipse cx="58" cy="42" rx="4.5" ry="3.5" fill="#1a1008"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">4. Concern</text>
    </g>
    <g transform="translate(0, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <circle cx="32" cy="38" r="7" fill="#ffffff"/>
      <circle cx="32" cy="38" r="3.5" fill="#1a1008"/>
      <circle cx="58" cy="38" r="7" fill="#ffffff"/>
      <circle cx="58" cy="38" r="3.5" fill="#1a1008"/>
      <path d="M 35 60 Q 45 74 55 60 Z" fill="#181412"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">5. Fear of Brood War</text>
    </g>
    <g transform="translate(190, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 25 28 L 40 33" stroke="#1c140d" stroke-width="3.5"/>
      <path d="M 50 33 L 65 28" stroke="#1c140d" stroke-width="3.5"/>
      <path d="M 35 60 Q 45 74 55 60 Z" fill="#181412"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">6. Heavy Duty</text>
    </g>
    <g transform="translate(380, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 26 35 Q 33 26 40 31" stroke="#1c140d" stroke-width="3" fill="none"/>
      <path d="M 50 31 Q 57 26 64 35" stroke="#1c140d" stroke-width="3" fill="none"/>
      <path d="M 35 62 Q 45 76 55 62 Z" fill="#181412"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">7. Camp Resignation</text>
    </g>
    <g transform="translate(570, 150)">
      <circle cx="45" cy="45" r="38" fill="url(#skin)"/>
      <path d="M 28 41 Q 33 45 38 41" stroke="#1a1008" stroke-width="2.5" fill="none"/>
      <path d="M 52 41 Q 57 45 62 41" stroke="#1a1008" stroke-width="2.5" fill="none"/>
      <path d="M 35 58 Q 45 72 55 58 Z" fill="#181412"/>
      <text x="45" y="105" fill="#d1d5db" font-size="12" text-anchor="middle">8. Dropping Weapon</text>
    </g>
  </g>

  <!-- Views H, I, J -->
  <rect x="880" y="570" width="680" height="390" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="900" y="600" fill="#f59e0b" font-size="16" font-weight="600">VIEWS H, I, J: RIG SKELETON &amp; SIGNATURE POSES</text>
  <g transform="translate(910, 630)">
    <text x="0" y="20" fill="#e5e7eb" font-size="14" font-weight="bold">I. RIG HIERARCHY (34 BONES)</text>
    <path d="M 80 45 L 80 85 L 80 145 M 80 65 L 45 85 L 30 135 M 80 65 L 115 85 L 130 135 M 80 145 L 55 200 L 55 270 M 80 145 L 105 200 L 105 270" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="45" r="5" fill="#34d399"/>
    <circle cx="55" cy="270" r="4" fill="#ef4444"/>
    <circle cx="105" cy="270" r="4" fill="#ef4444"/>
    <text x="80" y="295" fill="#9ca3af" font-size="11" text-anchor="middle">Broad Shoulder Chain &amp; Weapon Constraint</text>
  </g>

  <g transform="translate(1110, 630)">
    <text x="0" y="20" fill="#e5e7eb" font-size="14" font-weight="bold">J. SIX SIGNATURE ACTING POSES</text>
    <text x="0" y="55" fill="#f3f4f6" font-size="13">1. <tspan fill="#f59e0b">Potter's Guidance:</tspan> Both hands soft, circular guiding motion</text>
    <text x="0" y="85" fill="#f3f4f6" font-size="13">2. <tspan fill="#f59e0b">Anxious Grip:</tspan> Squeezing spear shaft tightly when horn sounds</text>
    <text x="0" y="115" fill="#f3f4f6" font-size="13">3. <tspan fill="#f59e0b">Campfire Memory:</tspan> Staring into embers holding dry clay piece</text>
    <text x="0" y="145" fill="#f3f4f6" font-size="13">4. <tspan fill="#f59e0b">Battlefield Shock:</tspan> Spotting Ilangathir between armies</text>
    <text x="0" y="175" fill="#f59e0b">5. <tspan fill="#f59e0b">Releasing Spear:</tspan> Opening palm and letting iron fall to earth</text>
    <text x="0" y="205" fill="#f3f4f6" font-size="13">6. <tspan fill="#f59e0b">Family Reunion:</tspan> Kneeling to wrap both arms around sons</text>

    <rect x="0" y="235" width="410" height="60" fill="#14110e" rx="6" stroke="#443427"/>
    <text x="15" y="258" fill="#d97706" font-size="12" font-weight="bold">HERO MOMENT 1 &amp; HERO MOMENT 5</text>
    <text x="15" y="278" fill="#9ca3af" font-size="11">Sequence 1 (Making horse) &amp; Sequence 9 (Reunion embrace)</text>
  </g>
</svg>
