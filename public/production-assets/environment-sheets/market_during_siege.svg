<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="siegeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212833"/>
      <stop offset="60%" stop-color="#3d3328"/>
      <stop offset="100%" stop-color="#594736"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#14110e"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — ENVIRONMENT CONCEPT SHEET 04: MARKET STREET (DURING SIEGE)</text>
  <text x="960" y="82" fill="#a89078" font-size="18">FOOD SCARCITY, SHUTTERED STALLS, SILENT STREETS (SEQUENCE 2)</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">ENV-04-MRKT-SIEGE</text>

  <!-- Perspective Render View -->
  <g transform="translate(50, 130)">
    <rect width="1500" height="480" fill="#382e25" rx="8"/>

    <!-- Left Building Row: Closed Shuttered Stalls -->
    <polygon points="50,140 180,60 310,140" fill="#693020"/>
    <rect x="80" y="140" width="200" height="180" fill="#4d3b2e"/>
    <rect x="330" y="120" width="180" height="200" fill="#473629"/>
    <polygon points="310,120 420,50 530,120" fill="#573e2a"/>

    <!-- Stalls Shuttered with Rough Timber Crossbars -->
    <rect x="110" y="180" width="140" height="110" fill="#241810"/>
    <line x1="100" y1="210" x2="260" y2="250" stroke="#3d2a1b" stroke-width="8"/>
    <line x1="100" y1="250" x2="260" y2="210" stroke="#3d2a1b" stroke-width="8"/>

    <!-- Overturned Empty Baskets on Street Veranda -->
    <g transform="translate(140, 310)">
      <ellipse cx="40" cy="30" rx="26" ry="12" fill="#332417" transform="rotate(25 40 30)"/>
      <ellipse cx="120" cy="25" rx="28" ry="14" fill="#2b1c11" transform="rotate(-15 120 25)"/>
      <text x="80" y="75" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">வெற்று கூடைகள் (Empty Baskets)</text>
    </g>

    <!-- Right Building Row: Shuttered with Torn Tattered Awnings -->
    <polygon points="1190,140 1320,60 1450,140" fill="#693020"/>
    <rect x="1220" y="140" width="200" height="180" fill="#4d3b2e"/>
    <rect x="970" y="120" width="210" height="200" fill="#473629"/>
    <polygon points="950,120 1075,50 1200,120" fill="#573e2a"/>

    <!-- Tied-up Grain Sacks & Solitary Shared Porridge Bowl -->
    <g transform="translate(1020, 290)">
      <rect x="30" y="20" width="40" height="30" rx="5" fill="#524332"/>
      <!-- Solitary Clay Porridge Bowl with sparse gruel -->
      <circle cx="120" cy="35" r="14" fill="#7a3e28"/>
      <circle cx="120" cy="35" r="10" fill="#d4c3a5"/>
      <text x="80" y="75" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">பகிர்ந்தளிக்கப்படும் எளிய கூழ் (Sparse Shared Gruel)</text>
    </g>

    <!-- Empty Wind-blown Street Center -->
    <path d="M 600 480 L 720 180 M 800 480 L 760 180" stroke="#291e16" stroke-width="3" stroke-dasharray="10,12"/>
    <!-- Distant closed citadel fortress wall in background -->
    <rect x="680" y="160" width="140" height="35" fill="#3d2c20"/>
    <text x="750" y="340" fill="#f87171" font-size="16" font-weight="bold" text-anchor="middle">அடைபட்ட வாயில்கள் — பஞ்சத்தின் மவுனம்</text>
    <text x="750" y="365" fill="#d1d5db" font-size="13" text-anchor="middle">Sequence 2: Mother &amp; Son face the reality of the siege</text>
  </g>

  <!-- Narrative Function & Dialogue Anchor Panel -->
  <rect x="50" y="630" width="1500" height="330" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="75" y="665" fill="#f59e0b" font-size="18" font-weight="bold">SCARCITY DRAMATURGY &amp; HISTORICAL CONTEXT (SEQUENCE 2)</text>

  <g transform="translate(75, 690)">
    <rect x="0" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="20" y="30" fill="#fcd34d" font-size="15" font-weight="bold">1. காட்சிப் பின்னணி (Narrative Setting)</text>
    <text x="20" y="60" fill="#e5e7eb" font-size="13">Screenplay Cue: <tspan fill="#f59e0b">Sequence 2 (120 - 240s)</tspan></text>
    <text x="20" y="85" fill="#d1d5db" font-size="12">• Massive Uraiyur fort gates have been barred shut.</text>
    <text x="20" y="105" fill="#d1d5db" font-size="12">• Trade carts from Kaveri river route cannot enter.</text>
    <text x="20" y="125" fill="#d1d5db" font-size="12">• Grain portions shrink; markets close quietly without riot.</text>
    <text x="20" y="145" fill="#d1d5db" font-size="12">• Silence replaces bustling barter.</text>
    <text x="20" y="170" fill="#34d399" font-size="11">Emotional Mood: Tense, Heavy, Restrained</text>

    <rect x="490" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="510" y="30" fill="#fcd34d" font-size="15" font-weight="bold">2. வசனத்தின் உணர்வுத் தளம் (Hero Dialogue)</text>
    <text x="510" y="60" fill="#e5e7eb" font-size="13">Dialogue: <tspan fill="#f59e0b">Ilangathir to Arumbu (194 - 218s)</tspan></text>
    <text x="510" y="85" fill="#fef08a" font-size="13">"அப்பா வென்றால்… அண்ணன்?"</text>
    <text x="510" y="110" fill="#d1d5db" font-size="12">• The empty market underscores the child's question.</text>
    <text x="510" y="130" fill="#d1d5db" font-size="12">• Arumbu ceases measuring grain into her basket.</text>
    <text x="510" y="150" fill="#d1d5db" font-size="12">• "எனக்கு யார் வென்றாலும் வேண்டாம். இருவரும் வீட்டுக்கு வந்தால் போதும்."</text>
    <text x="510" y="180" fill="#34d399" font-size="11">Staging: Quiet restraint, downward gaze into empty hands.</text>

    <rect x="980" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="1000" y="30" fill="#fcd34d" font-size="15" font-weight="bold">3. காட்சி மாற்றத்தின் விதி (Restoration Rule)</text>
    <text x="1000" y="60" fill="#e5e7eb" font-size="13">Resolution: <tspan fill="#f59e0b">Sequence 9 (Post-Ceasefire)</tspan></text>
    <text x="1000" y="85" fill="#d1d5db" font-size="12">• After the ceasefire, movement is restored GRADUALLY.</text>
    <text x="1000" y="105" fill="#d1d5db" font-size="12">• No instantaneous magical festival or confetti.</text>
    <text x="1000" y="125" fill="#d1d5db" font-size="12">• Heavy timber doors swing open with authentic friction.</text>
    <text x="1000" y="145" fill="#d1d5db" font-size="12">• Relief spreads through posture and shared food first.</text>
    <text x="1000" y="170" fill="#34d399" font-size="11">Production Principle: Grounded Realism</text>
  </g>
</svg>
