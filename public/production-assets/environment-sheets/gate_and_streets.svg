<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gateSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="60%" stop-color="#4a392b"/>
      <stop offset="100%" stop-color="#735238"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#14110e"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — ENVIRONMENT CONCEPT SHEET 08: FORTRESS GATE &amp; SURROUNDING STREETS</text>
  <text x="1020" y="82" fill="#a89078" font-size="18">RAMMED-EARTH RAMPARTS, TIMBER BASTIONS, &amp; SENTRY WALKWAY</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">ENV-08-GATE-WALL</text>

  <!-- Perspective Render View -->
  <g transform="translate(50, 130)">
    <rect width="1500" height="480" fill="url(#gateSky)" rx="8"/>

    <!-- Massive Rammed Earth Ramparts (Uraiyur Citadel Wall) -->
    <rect x="0" y="180" width="1500" height="220" fill="#524032" stroke="#3d2d21" stroke-width="3"/>

    <!-- Upper Sentry Parapet Walkway with Timber Palisade -->
    <rect x="0" y="140" width="1500" height="40" fill="#3b2b1e"/>
    {[-20, 80, 180, 280, 380, 480, 580, 880, 980, 1080, 1180, 1280, 1380, 1480].map((x, i) => (
      <rect key={i} x={x} y="95" width="22" height="45" fill="#291b11"/>
    ))}

    <!-- Gate Tower Structure Center (Bastion Header) -->
    <rect x="620" y="70" width="260" height="110" fill="#423124" stroke="#2b1c12" stroke-width="2"/>
    <polygon points="590,70 750,15 910,70" fill="#693020"/>

    <!-- Double Timber Fortress Gate Doors (Closed with Iron Straps) -->
    <g transform="translate(640, 180)">
      <rect x="0" y="0" width="220" height="220" fill="#2b1c11" stroke="#1c1109" stroke-width="4"/>
      <!-- Iron Reinforcing Crossbars -->
      <line x1="10" y1="50" x2="210" y2="50" stroke="#1c1f24" stroke-width="12"/>
      <line x1="10" y1="110" x2="210" y2="110" stroke="#1c1f24" stroke-width="12"/>
      <line x1="10" y1="170" x2="210" y2="170" stroke="#1c1f24" stroke-width="12"/>
      <!-- Heavy Timber Locking Bolt Bar across middle -->
      <rect x="-15" y="95" width="250" height="30" fill="#4a3424" stroke="#1c1109" stroke-width="2"/>
    </g>

    <!-- Brother Maaran standing on sentry rampart walkway (Sequence 2) -->
    <g transform="translate(800, 100)">
      <rect x="-8" y="0" width="16" height="40" fill="#2d3f56"/>
      <circle cx="0" cy="-10" r="8" fill="#a86d48"/>
      <circle cx="12" cy="15" r="10" fill="#44382e"/>
      <line x1="-14" y1="-25" x2="-14" y2="35" stroke="#3a3a3a" stroke-width="3"/>
      <text x="35" y="10" fill="#fcd34d" font-size="11" font-weight="bold">காவலில் மாறன் (Maaran on Watch)</text>
    </g>

    <!-- Foreground Dirt Highway with Moat Rim -->
    <rect x="0" y="400" width="1500" height="80" fill="#3b2b1d"/>
    <path d="M 0 460 Q 750 430 1500 460 L 1500 480 L 0 480 Z" fill="#1f3b47" opacity="0.85"/>
    <text x="750" y="465" fill="#a5f3fc" font-size="12" font-weight="bold" text-anchor="middle">அகழி (Fortress Defensive Moat Edge)</text>
  </g>

  <!-- Technical Fortress Architecture Notes Panel -->
  <rect x="50" y="630" width="1500" height="330" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="75" y="665" fill="#f59e0b" font-size="18" font-weight="bold">SANGAM FORTIFICATION DEFENSE &amp; BASTION ARCHAEOLOGY</text>

  <g transform="translate(75, 690)">
    <rect x="0" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="20" y="30" fill="#fcd34d" font-size="15" font-weight="bold">1. உறையூர் இஞ்சி (The Uraiyur Fort Wall)</text>
    <text x="20" y="60" fill="#e5e7eb" font-size="13">Literary Anchor: <tspan fill="#f59e0b">Purananuru 45 &amp; 343</tspan></text>
    <text x="20" y="85" fill="#d1d5db" font-size="12">"மண்பக வீழ்ந்த… நெடுமதில்"</text>
    <text x="20" y="110" fill="#9ca3af" font-size="12">• High earthen rampart compacted with Kaveri river alluvium.</text>
    <text x="20" y="130" fill="#9ca3af" font-size="12">• Timber revetments and palisade battlements.</text>
    <text x="20" y="150" fill="#9ca3af" font-size="12">• Sentry walkways allowing arrow slit defense.</text>
    <text x="20" y="180" fill="#34d399" font-size="11">Classification: Tier A (Directly Supported)</text>

    <rect x="490" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="510" y="30" fill="#fcd34d" font-size="15" font-weight="bold">2. கோட்டைக் கதவு &amp; ஆமைத்தாலி (Gate Construction)</text>
    <text x="510" y="60" fill="#e5e7eb" font-size="13">Archaeological report: <tspan fill="#f59e0b">Tamil Historic Fortifications</tspan></text>
    <text x="510" y="85" fill="#d1d5db" font-size="12">• Thick teak or rosewood double swing panels.</text>
    <text x="510" y="110" fill="#9ca3af" font-size="12">• Forged iron horizontal reinforcement straps against battering rams.</text>
    <text x="510" y="130" fill="#9ca3af" font-size="12">• Heavy horizontal timber crossbars (*aamaithali*).</text>
    <text x="510" y="150" fill="#9ca3af" font-size="12">• Kept barred in Seq 2-8; swing open in Seq 9.</text>
    <text x="510" y="180" fill="#34d399" font-size="11">Classification: Tier A (Archaeologically Supported)</text>

    <rect x="980" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="1000" y="30" fill="#fcd34d" font-size="15" font-weight="bold">3. புவியியல் தொடர்ச்சி (Topographical Continuity)</text>
    <text x="1000" y="60" fill="#e5e7eb" font-size="13">Spatial Logic Across All 10 Sequences:</text>
    <text x="1000" y="85" fill="#d1d5db" font-size="12">• North: Kaveri riverbanks &amp; potter's ward.</text>
    <text x="1000" y="105" fill="#d1d5db" font-size="12">• Center: City residential lane, market street, and shrine.</text>
    <text x="1000" y="125" fill="#d1d5db" font-size="12">• South Bastion: Citadel gate complex.</text>
    <text x="1000" y="145" fill="#d1d5db" font-size="12">• Far South Plains: Besieging army camp &amp; truce ground.</text>
    <text x="1000" y="180" fill="#34d399" font-size="11">Guarantees zero geographic teleportation.</text>
  </g>
</svg>
