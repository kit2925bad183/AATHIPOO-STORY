<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3815"/>
      <stop offset="60%" stop-color="#2d5224"/>
      <stop offset="100%" stop-color="#3d6e32"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#14110e"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — ENVIRONMENT CONCEPT SHEET 05: CIVIC GATHERING SPACE</text>
  <text x="890" y="82" fill="#a89078" font-size="18">MANRAM (மன்றம்), ANCIENT MARUDHAM TREE, &amp; ORAL POETIC TRADITION</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">ENV-05-MANRAM</text>

  <!-- Perspective Render View -->
  <g transform="translate(50, 130)">
    <rect width="1500" height="480" fill="#423528" rx="8"/>

    <!-- Surrounding Neighborhood Verandas in Background -->
    <rect x="120" y="160" width="220" height="120" fill="#5c4533"/>
    <polygon points="100,160 230,90 360,160" fill="#7a3e28"/>
    <rect x="1160" y="150" width="220" height="130" fill="#5c4533"/>
    <polygon points="1140,150 1270,80 1400,150" fill="#6e573a"/>

    <!-- Majestic Ancient Marudham / Banyan Shade Tree -->
    <g transform="translate(750, 60)">
      <!-- Vast Foliage Canopies -->
      <circle cx="0" cy="110" r="140" fill="url(#treeGrad)"/>
      <circle cx="-110" cy="130" r="100" fill="#26471d"/>
      <circle cx="110" cy="120" r="105" fill="#22401a"/>
      <!-- Massive Gnarled Trunk -->
      <rect x="-35" y="190" width="70" height="160" fill="#291c12"/>
      <!-- Aerial Roots hanging to the ground -->
      <line x1="-90" y1="180" x2="-80" y2="350" stroke="#1f150d" stroke-width="8"/>
      <line x1="85" y1="170" x2="95" y2="350" stroke="#1f150d" stroke-width="9"/>
    </g>

    <!-- Circular Raised Dressed-Stone Assembly Platform (Manram / Ambalam Thinnai) -->
    <g transform="translate(750, 390)">
      <!-- Stone plinth rim -->
      <ellipse cx="0" cy="20" rx="260" ry="60" fill="#36291e"/>
      <ellipse cx="0" cy="10" rx="260" ry="60" fill="#524032"/>
      <ellipse cx="0" cy="0" rx="250" ry="56" fill="#665241"/>

      <!-- Staged Encounter: Kovur Kizhar seated peacefully with poet staff -->
      <g transform="translate(-80, -25)">
        <ellipse cx="0" cy="20" rx="18" ry="8" fill="#261b13"/>
        <rect x="-12" y="-30" width="24" height="45" rx="6" fill="#e8dfcf"/>
        <circle cx="0" cy="-45" r="12" fill="#a87850"/>
        <line x1="-16" y1="-50" x2="-16" y2="25" stroke="#4a3728" stroke-width="4"/>
        <text x="0" y="38" fill="#fcd34d" font-size="12" font-weight="bold" text-anchor="middle">கோவூர் கிழார் (Poet)</text>
      </g>

      <!-- Ilangathir sitting opposite holding clay horse -->
      <g transform="translate(90, -20)">
        <ellipse cx="0" cy="20" rx="15" ry="6" fill="#261b13"/>
        <rect x="-10" y="-22" width="20" height="35" rx="5" fill="#a8623b"/>
        <circle cx="0" cy="-35" r="10" fill="#b87b53"/>
        <ellipse cx="14" cy="-10" rx="8" ry="5" fill="#9c5f3b"/>
        <text x="0" y="38" fill="#fcd34d" font-size="12" font-weight="bold" text-anchor="middle">இளங்கதிர் (Boy)</text>
      </g>
    </g>

    <!-- Label -->
    <text x="750" y="475" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle">ஊர் மன்றம் (The Village Assembly Tree &amp; Stone Platform)</text>
  </g>

  <!-- Research & Literature as Living Spoken Tradition Panel -->
  <rect x="50" y="630" width="1500" height="330" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="75" y="665" fill="#f59e0b" font-size="18" font-weight="bold">CIVIC SPACES &amp; SANGAM LITERATURE AS A SPOKEN TRADITION</text>

  <g transform="translate(75, 690)">
    <rect x="0" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="20" y="30" fill="#fcd34d" font-size="15" font-weight="bold">1. மன்றம் &amp; அம்பலம் (The Ancient Manram)</text>
    <text x="20" y="60" fill="#e5e7eb" font-size="13">Primary source: <tspan fill="#f59e0b">Purananuru 89, 128; Akananuru 124</tspan></text>
    <text x="20" y="85" fill="#d1d5db" font-size="12">"கந்துடை மன்றத்து… அம்பலம்"</text>
    <text x="20" y="110" fill="#9ca3af" font-size="12">• Ancient Tamil civic assembly under a sacred village tree.</text>
    <text x="20" y="130" fill="#9ca3af" font-size="12">• Open stone plinth (*thinnai*) where citizens gathered.</text>
    <text x="20" y="150" fill="#9ca3af" font-size="12">• NO grand medieval academy buildings or Greek-style agoras.</text>
    <text x="20" y="180" fill="#34d399" font-size="11">Classification: Tier A (Directly Supported)</text>

    <rect x="490" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="510" y="30" fill="#fcd34d" font-size="15" font-weight="bold">2. வாழ்வியல் இலக்கியம் (Living Oral Tradition)</text>
    <text x="510" y="60" fill="#e5e7eb" font-size="13">Dramatic Role: <tspan fill="#f59e0b">Sequence 3 (240 - 360s)</tspan></text>
    <text x="510" y="85" fill="#d1d5db" font-size="12">• Literature in Sangam society was an oral, spoken art.</text>
    <text x="510" y="105" fill="#d1d5db" font-size="12">• Poets were diplomats, travelers, and moral conscience.</text>
    <text x="510" y="125" fill="#d1d5db" font-size="12">• Kovur Kizhar listens to ordinary potters and children.</text>
    <text x="510" y="145" fill="#d1d5db" font-size="12">• "உன் கேள்வியை அரசனிடம் எடுத்துச் செல்வோம்."</text>
    <text x="510" y="170" fill="#34d399" font-size="11">Classification: Authentic Social Practice</text>

    <rect x="980" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="1000" y="30" fill="#fcd34d" font-size="15" font-weight="bold">3. கற்பனை தவிர்ப்புக் கொள்கை (Exclusion Guardrails)</text>
    <text x="1000" y="60" fill="#ef4444" font-size="13">What is deliberately NOT in this scene:</text>
    <text x="1000" y="85" fill="#d1d5db" font-size="12">• NO invented golden lecture halls or royal academies.</text>
    <text x="1000" y="105" fill="#d1d5db" font-size="12">• NO long monologues that stop the narrative pacing.</text>
    <text x="1000" y="125" fill="#d1d5db" font-size="12">• The encounter is brief, intimate, and immediately moves</text>
    <text x="1000" y="145" fill="#d1d5db" font-size="12">  the plot forward into the king's fortress in Sequence 4.</text>
    <text x="1000" y="170" fill="#ef4444" font-size="11">Classification: Restrained Production Choice</text>
  </g>
</svg>
