<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbb55" stop-opacity="1"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14110e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#14110e"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — ENVIRONMENT CONCEPT SHEET 07: SHRINE INTERIOR &amp; OFFERING ALTAR</text>
  <text x="1000" y="82" fill="#a89078" font-size="18">HUMAN-SCALE ALTAR, CLAY OIL LAMPS, &amp; ARUMBU'S PRAYER (SEQ 5)</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">ENV-07-SHRINE-INT</text>

  <!-- Perspective Render View: Courtyard Altar Close-up -->
  <g transform="translate(50, 130)">
    <rect width="1500" height="480" fill="#241a14" rx="8"/>

    <!-- Inner Earthen Walls with Wall Lamp Niches -->
    <rect x="180" y="60" width="1140" height="260" fill="#4d3727" stroke="#382518" stroke-width="2"/>

    <!-- Low Wall Lamp Niche (Left) -->
    <rect x="280" y="140" width="50" height="65" rx="12" fill="#26170d"/>
    <ellipse cx="305" cy="180" rx="12" ry="6" fill="#8c4227"/>
    <circle cx="305" cy="172" r="5" fill="#f59e0b"/>
    <circle cx="305" cy="172" r="28" fill="url(#lampGlow)"/>

    <!-- Low Wall Lamp Niche (Right) -->
    <rect x="1170" y="140" width="50" height="65" rx="12" fill="#26170d"/>
    <ellipse cx="1195" cy="180" rx="12" ry="6" fill="#8c4227"/>
    <circle cx="1195" cy="172" r="5" fill="#f59e0b"/>
    <circle cx="1195" cy="172" r="28" fill="url(#lampGlow)"/>

    <!-- Center Raised Granite Offering Altar Slab -->
    <g transform="translate(750, 300)">
      <!-- Stone base -->
      <polygon points="-160,80 160,80 200,30 -200,30" fill="#3d3025"/>
      <polygon points="-200,30 200,30 180,-10 -180,-10" fill="#524132"/>

      <!-- Terracotta Oil Lamp (Agal Vilakku) burning on altar -->
      <ellipse cx="0" cy="5" rx="22" ry="10" fill="#9c482d"/>
      <circle cx="0" cy="-2" r="7" fill="#ffedd5"/>
      <circle cx="0" cy="-2" r="55" fill="url(#lampGlow)"/>

      <!-- Scattered White Aathipoo Flower Petals on stone -->
      {[[-70, 15], [-40, -2], [50, 10], [80, 2], [-100, 12], [110, 18], [-20, 20]].map(([x, y], i) => (
        <g key={i} transform={`translate(${x}, ${y})`}>
          <circle cx="0" cy="0" r="6" fill="#ffffff"/>
          <circle cx="1.5" cy="-1" r="1.5" fill="#fef08a"/>
        </g>
      ))}

      <!-- Banana-leaf wrapped food parcel resting gently on side -->
      <rect x="-150" y="-5" width="45" height="28" rx="4" fill="#3f6634"/>
      <line x1="-150" y1="9" x2="-105" y2="9" stroke="#78553d" stroke-width="2"/>

      <text x="0" y="60" fill="#fcd34d" font-size="14" font-weight="bold" text-anchor="middle">கருங்கல் பலிபீடம் (Granite Offering Slab)</text>
    </g>

    <!-- Staged Acting: Mother Arumbu standing beside altar (Sequence 5: 492 - 508s) -->
    <g transform="translate(560, 250)">
      <ellipse cx="0" cy="150" rx="35" ry="12" fill="#140e0a"/>
      <!-- Saree & Form -->
      <path d="M -22 40 L 22 40 L 30 145 L -30 145 Z" fill="#8c4227"/>
      <rect x="-18" y="-30" width="36" height="75" rx="6" fill="#a46845"/>
      <circle cx="0" cy="-55" r="18" fill="#a46845"/>
      <circle cx="16" cy="-50" r="9" fill="#161210"/>
      <!-- Open palm dropping white flower petals -->
      <path d="M 12 10 Q 35 25 45 40" stroke="#a46845" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="48" cy="45" r="4" fill="#ffffff"/>
      <!-- Dialogue Bubble -->
      <rect x="-240" y="-120" width="280" height="50" rx="8" fill="#1c1612" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="-100" y="-95" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle">"எல்லோரும் நலமாகத் திரும்ப வேண்டும்."</text>
      <text x="-100" y="-78" fill="#d1d5db" font-size="10" text-anchor="middle">Sequence 5: Whisper of Maternal Hope (492 - 508s)</text>
    </g>
  </g>

  <!-- Dramaturgy & Non-Supernatural Grounding Panel -->
  <rect x="50" y="630" width="1500" height="330" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="75" y="665" fill="#f59e0b" font-size="18" font-weight="bold">DRAMATURGY OF HUMAN SOLACE &amp; NON-SUPERNATURAL STAGING</text>

  <g transform="translate(75, 690)">
    <rect x="0" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="20" y="30" fill="#fcd34d" font-size="15" font-weight="bold">1. அமைதியான மனித உணர்வு (Human Solace)</text>
    <text x="20" y="60" fill="#e5e7eb" font-size="13">Screenplay Moment: <tspan fill="#f59e0b">Sequence 5 (480 - 518s)</tspan></text>
    <text x="20" y="85" fill="#d1d5db" font-size="12">• As dusk settles, Arumbu carries the food parcel.</text>
    <text x="20" y="105" fill="#d1d5db" font-size="12">• She pauses alone before the neighborhood shrine.</text>
    <text x="20" y="125" fill="#d1d5db" font-size="12">• Leaves a quiet handful of Aathipoo flower petals.</text>
    <text x="20" y="145" fill="#d1d5db" font-size="12">• Her worry appears in pauses and controlled breathing.</text>
    <text x="20" y="170" fill="#34d399" font-size="11">Acting: Dignified, restrained, capable.</text>

    <rect x="490" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="510" y="30" fill="#fcd34d" font-size="15" font-weight="bold">2. வசனத்தின் உண்மைத் தன்மை (Dialogue Attribution)</text>
    <text x="510" y="60" fill="#e5e7eb" font-size="13">Attribution Notice: <tspan fill="#f59e0b">Newly Authored Screenplay Line</tspan></text>
    <text x="510" y="85" fill="#fef08a" font-size="13">"எல்லோரும் நலமாகத் திரும்ப வேண்டும்."</text>
    <text x="510" y="110" fill="#d1d5db" font-size="12">• Honest labeling: This is newly written dialogue,</text>
    <text x="510" y="130" fill="#d1d5db" font-size="12">  NOT an ancient Sangam quotation.</text>
    <text x="510" y="150" fill="#d1d5db" font-size="12">• The film never mislabels modern lines as ancient verses.</text>
    <text x="510" y="180" fill="#34d399" font-size="11">Production Principle: Intellectual Integrity</text>

    <rect x="980" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="1000" y="30" fill="#fcd34d" font-size="15" font-weight="bold">3. அமானுஷ்யம் தவிர்த்தல் (Zero Supernatural Tropes)</text>
    <text x="1000" y="60" fill="#ef4444" font-size="13">Strict Anti-Fantasy Rules:</text>
    <text x="1000" y="85" fill="#d1d5db" font-size="12">• NO divine booming voices commanding kings.</text>
    <text x="1000" y="105" fill="#d1d5db" font-size="12">• NO miraculous celestial weapons rescuing the family.</text>
    <text x="1000" y="125" fill="#d1d5db" font-size="12">• NO glowing deities manifesting from the altar.</text>
    <text x="1000" y="145" fill="#d1d5db" font-size="12">• The peace resolution comes solely through human wisdom,</text>
    <text x="1000" y="165" fill="#d1d5db" font-size="12">  poetic truth, and rulers' conscience.</text>
    <text x="1000" y="190" fill="#ef4444" font-size="11">Classification: Grounded Historical Drama</text>
  </g>
</svg>
