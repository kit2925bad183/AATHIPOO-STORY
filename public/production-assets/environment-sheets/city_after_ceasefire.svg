<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#14110e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="reliefSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#476582"/>
      <stop offset="60%" stop-color="#a87c53"/>
      <stop offset="100%" stop-color="#e0a367"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#14110e"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#3d2c1e" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" fill="#241a14" rx="8"/>
  <text x="65" y="82" fill="#e5c07b" font-size="26" font-weight="bold">ஆத்திப்பூ — ENVIRONMENT CONCEPT SHEET 09: CITY AFTER THE CEASEFIRE</text>
  <text x="980" y="82" fill="#a89078" font-size="18">OPEN GATES, FOOD CARTS, REUNITED FAMILY, &amp; GRADUAL RESTORATION (SEQ 9)</text>
  <text x="1420" y="82" fill="#d97706" font-size="14" font-family="monospace">ENV-09-POST-WAR</text>

  <!-- Perspective Render View -->
  <g transform="translate(50, 130)">
    <rect width="1500" height="480" fill="url(#reliefSky)" rx="8"/>

    <!-- Fortress Wall in Background with OPEN GATES -->
    <rect x="0" y="160" width="1500" height="180" fill="#5c4a39"/>
    <!-- Gate Portal Opening -->
    <rect x="640" y="160" width="220" height="180" fill="#2b1c11"/>
    <!-- Folded Back Open Gate Doors -->
    <rect x="610" y="160" width="30" height="180" fill="#3d2a1c"/>
    <rect x="860" y="160" width="30" height="180" fill="#3d2a1c"/>

    <!-- Sunlit Golden Morning Highway -->
    <rect x="0" y="340" width="1500" height="140" fill="#5e4935"/>

    <!-- Moving Wooden Bull-Cart Carrying Grain Sacks into City -->
    <g transform="translate(420, 290)">
      <!-- Cart Wooden Bed -->
      <rect x="0" y="20" width="160" height="45" fill="#4a3424"/>
      <!-- Sacks of Grain (Thinai / Paddy) piled high -->
      <ellipse cx="40" cy="10" rx="30" ry="18" fill="#a8916d"/>
      <ellipse cx="90" cy="5" rx="32" ry="18" fill="#bfa57c"/>
      <ellipse cx="130" cy="12" rx="28" ry="16" fill="#a8916d"/>
      <!-- Spoked Wooden Cart Wheels -->
      <circle cx="35" cy="65" r="32" fill="#362215"/>
      <circle cx="35" cy="65" r="24" fill="#523824"/>
      <circle cx="125" cy="65" r="32" fill="#362215"/>
      <circle cx="125" cy="65" r="24" fill="#523824"/>
      <text x="80" y="115" fill="#fcd34d" font-size="12" font-weight="bold" text-anchor="middle">தானிய வண்டி (Grain Cart)</text>
    </g>

    <!-- Center Staged Reunion: Father Sembiyan, Brother Maaran, Arumbu, Ilangathir -->
    <g transform="translate(920, 310)">
      <ellipse cx="70" cy="115" rx="110" ry="32" fill="#261b11"/>

      <!-- Father Sembiyan & Brother Maaran Embracing -->
      <g transform="translate(30, 0)">
        <rect x="-18" y="10" width="36" height="75" rx="6" fill="#80502a"/>
        <circle cx="0" cy="-8" r="16" fill="#98603c"/>
      </g>
      <g transform="translate(75, 0)">
        <rect x="-16" y="10" width="32" height="72" rx="6" fill="#2d3f56"/>
        <circle cx="0" cy="-8" r="15" fill="#a86d48"/>
      </g>

      <!-- Mother Arumbu reaching to wrap arms around them -->
      <g transform="translate(-15, 20)">
        <path d="M -15 10 L 15 10 L 20 80 L -20 80 Z" fill="#8c4227"/>
        <circle cx="0" cy="-8" r="14" fill="#a46845"/>
      </g>

      <!-- Ilangathir standing between them with spontaneous smile -->
      <g transform="translate(115, 25)">
        <rect x="-12" y="10" width="24" height="55" rx="4" fill="#a8623b"/>
        <circle cx="0" cy="-6" r="12" fill="#b87b53"/>
      </g>

      <text x="60" y="145" fill="#fcd34d" font-size="13" font-weight="bold" text-anchor="middle">குடும்பத்தின் அமைதித் தழுவல் (Family Reunion)</text>
    </g>

    <!-- Kovur Kizhar walking peacefully down the road with his staff -->
    <g transform="translate(1320, 310)">
      <rect x="-14" y="0" width="28" height="70" rx="6" fill="#e8dfcf"/>
      <circle cx="0" cy="-14" r="14" fill="#a87850"/>
      <line x1="20" y1="-25" x2="20" y2="80" stroke="#4a3728" stroke-width="4"/>
      <text x="0" y="100" fill="#fcd34d" font-size="11" font-weight="bold" text-anchor="middle">கோவூர் கிழார் (Poet)</text>
    </g>
  </g>

  <!-- Dramatic Pacing & Historical Realism Panel -->
  <rect x="50" y="630" width="1500" height="330" fill="#1c1612" rx="8" stroke="#332418"/>
  <text x="75" y="665" fill="#f59e0b" font-size="18" font-weight="bold">POST-WAR RECONSTRUCTION DRAMATURGY &amp; RESOLUTION PACING</text>

  <g transform="translate(75, 690)">
    <rect x="0" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="20" y="30" fill="#fcd34d" font-size="15" font-weight="bold">1. படிப்படியான அமைதி திரும்புதல் (Gradual Relief)</text>
    <text x="20" y="60" fill="#e5e7eb" font-size="13">Directing Rule: <tspan fill="#f59e0b">Sequence 9 (1020 - 1140s)</tspan></text>
    <text x="20" y="85" fill="#d1d5db" font-size="12">• Life returns with authentic slowness, not theatrical magic.</text>
    <text x="20" y="105" fill="#d1d5db" font-size="12">• Stalls re-open one by one along the familiar market lane.</text>
    <text x="20" y="125" fill="#d1d5db" font-size="12">• Carts creak under weight of grain, entering the fort.</text>
    <text x="20" y="145" fill="#d1d5db" font-size="12">• Soldiers lower weapons and become brothers and sons again.</text>
    <text x="20" y="170" fill="#34d399" font-size="11">Production Principle: Emotional Truth</text>

    <rect x="490" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="510" y="30" fill="#fcd34d" font-size="15" font-weight="bold">2. குடும்பக் களத்தின் வெற்றி (Family-Centered Climax)</text>
    <text x="510" y="60" fill="#e5e7eb" font-size="13">Theme: <tspan fill="#f59e0b">Anti-War Family Resolution</tspan></text>
    <text x="510" y="85" fill="#d1d5db" font-size="12">• Sembiyan (besieger) &amp; Maaran (defender) embrace.</text>
    <text x="510" y="105" fill="#d1d5db" font-size="12">• Neither is labeled an enemy or a traitor.</text>
    <text x="510" y="125" fill="#d1d5db" font-size="12">• The film refuses martial jingoism or glorification of war.</text>
    <text x="510" y="145" fill="#d1d5db" font-size="12">• The ultimate victory is the survival of the household.</text>
    <text x="510" y="170" fill="#34d399" font-size="11">Dramaturgy: Intimate, grounded humanism.</text>

    <rect x="980" y="0" width="460" height="240" fill="#241a14" rx="6" stroke="#443427"/>
    <text x="1000" y="30" fill="#fcd34d" font-size="15" font-weight="bold">3. தொடக்கக் களத்துக்கு மீளுதல் (Cyclical Return)</text>
    <text x="1000" y="60" fill="#e5e7eb" font-size="13">Sequence 10: <tspan fill="#f59e0b">The Potter's Wheel Turns Again</tspan></text>
    <text x="1000" y="85" fill="#d1d5db" font-size="12">• The film ends where it began: by the Kaveri river courtyard.</text>
    <text x="1000" y="105" fill="#d1d5db" font-size="12">• On the wooden bench rests the old mended clay horse</text>
    <text x="1000" y="125" fill="#d1d5db" font-size="12">  beside the newly completed unbroken horse.</text>
    <text x="1000" y="145" fill="#d1d5db" font-size="12">• Kovur Kizhar walks toward the horizon, work fulfilled.</text>
    <text x="1000" y="170" fill="#34d399" font-size="11">Total Runtime: Exactly 1,200 Seconds (20:00)</text>
  </g>
</svg>
